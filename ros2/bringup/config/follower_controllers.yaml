# The follower: joint_state_broadcaster publishes /follower/joint_states, and
# forward_controller takes /follower/forward_controller/commands
# (std_msgs/Float64MultiArray) from the bridge.
#
# `/**/` because the nodes live under the /follower namespace; a bare
# `controller_manager:` key would not match /follower/controller_manager.
/**/controller_manager:
  ros__parameters:
    update_rate: 200  # Hz. Keep equal to control_hz in bridge.yaml.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    forward_controller:
      type: forward_command_controller/ForwardCommandController

/**/forward_controller:
  ros__parameters:
    # The command array has no names, so this ORDER is the contract: it must
    # be joint_names in bridge.yaml, in the same order.
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
      - gripper
    interface_name: position
    # enforce_command_limits stays false: URDF gripper/wrist_roll limits are narrower than calibrated.
