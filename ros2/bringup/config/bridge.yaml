# Parameters for the zeroruntime bridge node, both roles. Each role ignores
# the keys meant for the other. The launch files pass this with --params-file
# and add robot_id from the command line.
#
# The token and room id are NOT here: the node reads ZERORUNTIME_AUTH_TOKEN
# and ZERORUNTIME_MEETING_ID from the environment (env.sh loads them from
# .env), so nothing secret ends up in a file you might commit.
/**:
  ros__parameters:
    # Order is a contract twice over: both machines must list the same joints
    # in the same order, and the follower's forward_controller.joints in
    # follower_controllers.yaml must match it too.
    joint_names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]

    # Each machine normalises against its OWN arm's lerobot calibration,
    # found by robot_id under ~/.cache/huggingface/lerobot/calibration.
    # Set calibration_file instead to point at a JSON directly.
    calibration_profile: lerobot_so101_rad

    leader_states_topic: /leader/joint_states
    follower_states_topic: /follower/joint_states
    follower_commands_topic: /follower/forward_controller/commands

    # Keep equal to update_rate in the *_controllers.yaml files.
    control_hz: 200

    # 0.0 arms immediately: the follower travels to the leader's pose at the
    # max_norm_step slew below (a full sweep in ~1.3 s), not in one jump.
    # A positive value refuses to arm while any joint differs by more than
    # that, in normalised units (0.05 = 5 % of travel).
    max_misalignment: 0.0

    # Follower slew limit: the most a joint may move per 5 ms tick, as a
    # fraction of its full calibrated travel. 200 Hz x 0.00375 = 0.75 full
    # travels per second, the same glide as the lerobot SO-101 path. Raise it
    # for less lag behind the leader, at the cost of harder lunges.
    max_norm_step: 0.00375

    # Follower only: cameras, sent to the leader as video. One label per
    # handle. Handles must be strings: /dev/video* or /dev/v4l/by-path/...
    # paths, or QUOTED indices like ['0', '2'] -- an unquoted [0, 2] is an
    # integer array and the node refuses it at startup.
    # camera_handles: [/dev/video0, /dev/video2]
    # camera_labels: [front, wrist]
    # camera_width: 640
    # camera_height: 480
    # camera_fps: 30

    # Follower only: where `record_on` writes, and the task text stored
    # with each episode.
    # recording_dir: ./sessions
    # episode_task: pick up the cube
    # Also record the meeting in VideoSDK's cloud (billed), on top of local.
    # cloud_recording: true
    # Seconds to wait for the cloud recorder before falling back to local.
    # cloud_recording_timeout_s: 90.0
