# The leader: read-only. joint_state_broadcaster publishes /leader/joint_states,
# which the bridge reads. No command controller -- the arm stays limp.
#
# `/**/` because the nodes live under the /leader namespace; a bare
# `controller_manager:` key would not match /leader/controller_manager.
/**/controller_manager:
  ros__parameters:
    update_rate: 200  # Hz. Keep equal to control_hz in bridge.yaml.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
